<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">Conduit 端到端可靠上报链路</title>
  <desc id="desc">设备经 EMQX 和 transport 写入 Redis 总线，平台确认持久接收后由 transport 向设备发送业务回执。</desc>
  <style>
    :root {
      --fg:#1a1a2e; --muted:#6b7280; --bg:#f8f9fc; --card:#ffffff; --border:#e2e8f0;
      --p:#6366f1;  --b:#0284c7;    --g:#059669;   --y:#d97706;   --r:#dc2626;
    }
    :root[data-theme="dark"] {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
      --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#e5e7eb; --muted:#9ca3af; --bg:#1a1a2e; --card:#252540; --border:#3a3a5c;
        --p:#818cf8;  --b:#38bdf8;    --g:#34d399;   --y:#fbbf24;   --r:#f87171;
      }
    }
    .bg{fill:var(--bg)} .box{fill:var(--card);stroke:var(--border);stroke-width:1.5}
    .title{fill:var(--fg);font:700 14px system-ui,sans-serif}.label{fill:var(--fg);font:600 13px system-ui,sans-serif}
    .sub{fill:var(--muted);font:11px system-ui,sans-serif}.flow{stroke:var(--b);stroke-width:2;fill:none}
    .ack{stroke:var(--g);stroke-width:2;fill:none}.ack-label{fill:var(--g);font:600 11px system-ui,sans-serif}
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--b)"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="var(--g)"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="180"/>
  <text class="title" x="500" y="24" text-anchor="middle">端到端可靠上报</text>

  <rect class="box" x="20" y="50" width="125" height="60" rx="8"/>
  <text class="label" x="82.5" y="76" text-anchor="middle">设备</text>
  <text class="sub" x="82.5" y="96" text-anchor="middle">持久保存待确认消息</text>

  <rect class="box" x="180" y="50" width="125" height="60" rx="8"/>
  <text class="label" x="242.5" y="76" text-anchor="middle">EMQX</text>
  <text class="sub" x="242.5" y="96" text-anchor="middle">QoS 1 接入</text>

  <rect class="box" x="340" y="50" width="125" height="60" rx="8"/>
  <text class="label" x="402.5" y="76" text-anchor="middle">Transport</text>
  <text class="sub" x="402.5" y="96" text-anchor="middle">写总线后回执</text>

  <rect class="box" x="500" y="50" width="125" height="60" rx="8"/>
  <text class="label" x="562.5" y="76" text-anchor="middle">Redis Stream</text>
  <text class="sub" x="562.5" y="96" text-anchor="middle">appendfsync always</text>

  <rect class="box" x="660" y="50" width="125" height="60" rx="8"/>
  <text class="label" x="722.5" y="76" text-anchor="middle">Server</text>
  <text class="sub" x="722.5" y="96" text-anchor="middle">解码与物模型校验</text>

  <rect class="box" x="820" y="50" width="125" height="60" rx="8"/>
  <text class="label" x="882.5" y="76" text-anchor="middle">数据存储</text>
  <text class="sub" x="882.5" y="96" text-anchor="middle">InfluxDB / Redis</text>

  <line class="flow" x1="149" y1="80" x2="174" y2="80" marker-end="url(#arrow-blue)"/>
  <line class="flow" x1="309" y1="80" x2="334" y2="80" marker-end="url(#arrow-blue)"/>
  <line class="flow" x1="469" y1="80" x2="494" y2="80" marker-end="url(#arrow-blue)"/>
  <line class="flow" x1="629" y1="80" x2="654" y2="80" marker-end="url(#arrow-blue)"/>
  <line class="flow" x1="789" y1="80" x2="814" y2="80" marker-end="url(#arrow-blue)"/>

  <path class="ack" d="M402.5 114 V140 H82.5 V116" marker-end="url(#arrow-green)"/>
  <text class="ack-label" x="242.5" y="158" text-anchor="middle">QoS 0 业务回执：已持久写入总线</text>
</svg>
