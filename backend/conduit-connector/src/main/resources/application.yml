server:
  port: 8081

spring:
  application:
    name: conduit-connector
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

conduit:
  connector:
    mqtt:
      host: ${EMQX_HOST:localhost}
      port: ${EMQX_PORT:1883}
      client-id: ${CONNECTOR_CLIENT_ID:conduit-connector-1}
      username: ${CONNECTOR_MQTT_USERNAME:}
      password: ${CONNECTOR_MQTT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
